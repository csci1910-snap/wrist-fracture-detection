[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "snap"
version = "0.0.1"
description = "Detecting fractures in pediatric wrist X-rays, and checking whether models rely on shortcuts like casts or age instead of the fracture."
authors = [
  { name = "Team Snap" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["snap"]
force-sort-within-sections = true

